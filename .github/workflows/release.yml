name: Netch Release CI
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Checksum
        shell: pwsh
        run: |
          echo "SOURCE_NETCH_SHA256=$(.\sha256.ps1 .\Netch)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_OTHER_SHA256=$(.\sha256.ps1 .\Other)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_REDIRECTOR_SHA256=$(.\sha256.ps1 .\Redirector)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_ROUTEHELPER_SHA256=$(.\sha256.ps1 .\RouteHelper)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Cache Netch
        uses: actions/cache@v4
        with:
          key: Netch-${{ runner.os }}-Netch-${{ env.SOURCE_NETCH_SHA256 }}
          path: |
            .\Netch\bin

      - name: Cache Other
        uses: actions/cache@v4
        with:
          key: Netch-${{ runner.os }}-Other-${{ env.SOURCE_OTHER_SHA256 }}
          path: |
            .\Other\release

      - name: Cache Redirector
        uses: actions/cache@v4
        with:
          key: Netch-${{ runner.os }}-Redirector-${{ env.SOURCE_REDIRECTOR_SHA256 }}
          path: |
            .\Redirector\bin

      - name: Cache RouteHelper
        uses: actions/cache@v4
        with:
          key: Netch-${{ runner.os }}-RouteHelper-${{ env.SOURCE_ROUTEHELPER_SHA256 }}
          path: |
            .\RouteHelper\bin

      - name: Check Other
        id: check_other
        uses: andstor/file-existence-action@v3
        with:
          files: .\other\release\xray.exe

      - name: Setup Go
        uses: actions/setup-go@v5
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          go-version: '1.22.x'

      - name: Setup C++
        uses: msys2/setup-msys2@v2
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          update: true
          release: true
          install: base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-libevent mingw-w64-x86_64-pcre2 mingw-w64-x86_64-freetype mingw-w64-x86_64-libpng mingw-w64-x86_64-bzip2 mingw-w64-x86_64-openssl mingw-w64-x86_64-mbedtls mingw-w64-x86_64-libsodium mingw-w64-x86_64-c-ares mingw-w64-x86_64-boost mingw-w64-x86_64-libmariadbclient unzip p7zip autoconf automake libtool

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        if: steps.check_other.outputs.files_exists == 'false'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          .\build.ps1 -Configuration Release -OutputPath release

      - name: Run Smoke Tests (.NET MSTest)
        shell: pwsh
        run: |
          dotnet test .\Tests\Tests.csproj -c Release -p:Platform=x64 --logger "console;verbosity=normal"

      - name: Run Binary Smoke Tests
        shell: pwsh
        run: |
          Write-Host "=== Binary Existence & Integrity Smoke Test ==="
          $requiredFiles = @(
            "release\Netch.exe",
            "release\bin\Redirector.bin",
            "release\bin\nfapi.dll",
            "release\bin\RouteHelper.bin",
            "release\bin\sing-box.exe",
            "release\bin\xray.exe"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "CRITICAL: Required binary missing: $file"
              exit 1
            }
            $item = Get-Item $file
            Write-Host " [OK] $file ($($item.Length) bytes)"
          }

          Write-Host "`n=== Proxy Core Executable Health Checks ==="
          Write-Host "Checking sing-box version..."
          & .\release\bin\sing-box.exe version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "sing-box executable check failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "Checking xray-core version..."
          & .\release\bin\xray.exe version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "xray executable check failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "`n=== All Smoke Tests Passed Successfully! ==="

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "Latest" }
          $pkg = "Netch-$ver.7z"
          echo "PACKAGE_NAME=$pkg" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          7z a -mx9 $pkg release
          7z rn $pkg release Netch

      - name: Checksum
        shell: pwsh
        run: |
          $pkg = $env:PACKAGE_NAME
          $hash=(Get-FileHash $pkg -Algorithm SHA256).Hash.ToLower()
          echo "NETCH_SHA256=$hash" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Generate Changelog
        shell: pwsh
        run: |
          git fetch --tags --force
          $currTag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"

          Write-Host "Extracting previous version tag for $currTag..."
          $prevTag = git describe --tags --abbrev=0 --exclude="$currTag" HEAD 2>$null
          if (-not $prevTag) {
            $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          }
          if (-not $prevTag) {
            $prevTag = $(git rev-list --max-parents=0 HEAD)
          }
          Write-Host "Previous tag: $prevTag, Current ref: $currTag"

          $raw = (git log "$prevTag..HEAD" --no-merges --format="%h%x09%s%x09%b%x1E") -join "`n"
          $entries = $raw -split "\x1E" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine("[![](https://img.shields.io/badge/Telegram-Channel-blue)](https://t.me/netch_channel) [![](https://img.shields.io/badge/Telegram-Group-green)](https://t.me/netch_group)")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("## Changelog / 更新日志 ($currTag)")
          if ($prevTag) {
            [void]$sb.AppendLine("> 对比基准：[$prevTag...$currTag](https://github.com/$repo/compare/$prevTag...$currTag)")
          }
          [void]$sb.AppendLine()

          $hasCommits = $false
          foreach ($entry in $entries) {
              $parts = $entry -split "\t", 3
              if ($parts.Count -lt 2) { continue }
              $hash = $parts[0].Trim()
              $subject = $parts[1].Trim()
              $body = if ($parts.Count -ge 3) { $parts[2] } else { "" }

              $hasCommits = $true
              [void]$sb.AppendLine("* **$subject** ([$hash](https://github.com/$repo/commit/$hash))")

              if (-not [string]::IsNullOrWhiteSpace($body)) {
                  $lines = $body -split "\r?\n"
                  foreach ($line in $lines) {
                      $trimmed = $line.Trim()
                      if ($trimmed.StartsWith("- ") -or $trimmed.StartsWith("* ")) {
                          $content = $trimmed.Substring(2).Trim()
                          [void]$sb.AppendLine("  - $content")
                      } elseif ($trimmed.StartsWith("Co-Authored-By:") -or [string]::IsNullOrWhiteSpace($trimmed)) {
                          # skip
                      } else {
                          [void]$sb.AppendLine("  - $trimmed")
                      }
                  }
              }
          }

          if (-not $hasCommits) {
              [void]$sb.AppendLine("* Maintenance and automated deployment for $currTag")
          }

          [void]$sb.AppendLine()
          [void]$sb.AppendLine("## Checksums / 校验和")
          [void]$sb.AppendLine("| 文件名 | SHA256 |")
          [void]$sb.AppendLine("| :- | :- |")
          [void]$sb.AppendLine("| $env:PACKAGE_NAME | $env:NETCH_SHA256 |")

          [System.IO.File]::WriteAllText("release_body.md", $sb.ToString(), [System.Text.Encoding]::UTF8)

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          draft: false
          files: |
            ${{ env.PACKAGE_NAME }}
          body_path: release_body.md
